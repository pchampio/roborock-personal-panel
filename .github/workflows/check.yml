name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  panel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: python tools/prepare_dependencies.py --only python-roborock
      - run: pip install -r requirements.txt ./.deps/python-roborock
      - run: python -m unittest discover -s tests -v
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node tools/capture-demo.cjs --check-selection
      - run: npm run screenshots
      - run: docker build -t panel-check .
  server-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/prepare_dependencies.py --only local-roborock-server
      - run: pip install './.deps/local-roborock-server[dev]' pytest-asyncio
      - run: python -m pytest -q tests/test_cloudflare_turn.py tests/test_fw_createca.py tests/test_config.py
        working-directory: .deps/local-roborock-server
